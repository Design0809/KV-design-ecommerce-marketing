interface:
  display_name: "KV design"
  short_description: "支持销售转化与品牌产品两类主视觉，三案卡片选择后成图，准确呈现商品、Logo 与卖点并核验交付"
  default_prompt: "使用 $kv-design，根据我的商品与品牌资料确定主视觉类型，在 G1 提供三种构图与风格方案及 D 不满意选项，我选择后制作样图并按指定尺寸、格式和数量交付，完成后询问是否需要其他视角、卖点图或详情页。"
  icon_small: "assets/icon.svg"
  icon_large: "assets/icon.svg"
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
